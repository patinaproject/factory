manifest_version: 2
name: blocker-order
version: "0.1.0"
description: "Orders a Kanban worker's card behind the cards of the Linear issues that block its issue. When claude-session prints {\"waiting_on\": [task id, ...]} instead of starting Claude, the hook links each card as the worker's card's parent and blocks the card with kind dependency, from the worker process that holds the card's identity, then rewrites the tool result so the worker stops. A link Hermes refuses as a cycle links nothing for that card, and when no card linked, the result tells the worker to post one notice and run claude-session again with --ignore-blockers. When a finished claude-session report's result starts with Waiting for pull request: and a GitHub pull request URL, parks the card in scheduled on every board with the pull request as owner/name#number and tells the worker to stop; a line without that URL, or a refused schedule, gets the needs_input block. When a claude-session report's result starts with Needs input:, on the first run and on every resume, parks a triage-board card in scheduled with the result and a last comments_seen line as the reason, and blocks a card on any other board with kind needs_input. After any successful triage-board park whose reason starts with Needs input:, its own or the worker's own kanban_schedule, posts the round once per run through linear-agent-session's linear_triage_round tool, and comments on the card when the post failed or its outcome is unknown. Provides the claude_session_run tool, which runs claude-session to its end in one worker tool call (a login shell, its own process group, a stop at its limit or on interrupt, and the pull request's gh pr view for a successful run), and watches its result like the process_manage (process on older Hermes) and terminal tool results, reading the process log when wait cut a long report short."
provides_hooks:
  - transform_tool_result
provides_tools:
  - claude_session_run
