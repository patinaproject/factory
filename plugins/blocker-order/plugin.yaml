manifest_version: 2
name: blocker-order
version: "0.1.0"
description: "Orders a Kanban worker's card behind the cards of the Linear issues that block its issue. When claude-session prints {\"waiting_on\": [task id, ...]} instead of starting Claude, the hook links each card as the worker's card's parent and blocks the card with kind dependency, from the worker process that holds the card's identity, then rewrites the tool result so the worker stops. A link Hermes refuses as a cycle links nothing for that card, and when no card linked, the result tells the worker to post one notice and run claude-session again with --ignore-blockers. When a claude-session report's result starts with Needs input:, on the first run and on every resume, parks a triage-board card in scheduled and has linear-agent-session's linear_triage_round tool post the round, and blocks a card on any other board with kind needs_input. Watches the process_manage (process on older Hermes) and terminal tools, and reads the process log when wait cut a long report short."
provides_hooks:
  - transform_tool_result
