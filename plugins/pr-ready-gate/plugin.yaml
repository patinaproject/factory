manifest_version: 2
name: pr-ready-gate
version: "0.1.0"
description: "Blocks kanban_complete and kanban_request_review in gated worker profiles until the task's pull request is open, not a draft, mergeable (mergeStateStatus CLEAN), and at the worktree's HEAD, or already merged at the worktree's HEAD. A merged pull request blocks kanban_request_review and points the worker to kanban_complete."
provides_hooks:
  - pre_tool_call
config_schema:
  gated_profiles:
    type: list
    default: [claude-worker]
    description: "Profiles whose Kanban workers must have a merge-ready or merged pull request before kanban_complete or kanban_request_review succeeds."
