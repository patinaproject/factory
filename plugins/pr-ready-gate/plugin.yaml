manifest_version: 2
name: pr-ready-gate
version: "0.1.0"
description: "Blocks kanban_complete and kanban_request_review in gated worker profiles until the task's pull request is open, not a draft, mergeable (mergeStateStatus CLEAN), and at the worktree's HEAD, or already merged at the worktree's HEAD. A merged pull request blocks kanban_request_review and points the worker to kanban_complete. kanban_request_review also accepts a pull request that GitHub holds at UNSTABLE, or at BLOCKED while a reviewer has to act (a review is required or requested changes, or a person started a review thread that is still open), or at BLOCKED while an approved pull request waits only for the merge queue (a configured queue label, a configured queue check whose newest run is still pending, or GitHub reporting it queued), or at BLOCKED while an approved pull request that is not queued waits for a person to add it to the merge queue (the base branch rules include an update rule and the merge_queue setting has an entry for the repository; with a pull_request rule that requires approval of the last push, the approval must be on the current head), once the gate has confirmed from the base branch rules that the newest run of every required check passed, commits are signed, no review thread that a bot started is open, no changes-requested review is on the current head, and no rule it cannot verify applies. A pending or failed check that no rule requires does not stop it. Once a card lands in review, it asks each reviewer whose changes-requested review is on an older head to review again, and names them in the tool result, along with each failed or pending check that no branch rule requires and the number of open reviewer-owned threads. It also asks the owner of the card's Linear issue to review on GitHub, through the GitHub account the owner connected in Linear. When an approved pull request waits for the merge queue, the tool result carries waiting_for_merge_queue. When it waits for a person to add it to the queue, the tool result carries waiting_for_queue_entry. kanban_complete still needs every check to pass."
provides_hooks:
  - pre_tool_call
  - transform_tool_result
config_schema:
  gated_profiles:
    type: list
    default: [claude-worker]
    description: "Profiles whose Kanban workers must have a merge-ready or merged pull request before kanban_complete or kanban_request_review succeeds."
  merge_queue:
    type: dict
    default: {}
    description: >-
      Per-repository merge queue signals, keyed by <owner>/<repo>. Each entry lists the queue's label
      names and check names, as {"labels": [...], "checks": [...]}. An approved BLOCKED pull request
      that has one of the labels, whose newest run of one of the checks is still pending, or that
      GitHub reports in the merge queue, passes kanban_request_review. An entry for a repository,
      even {}, also declares that an update rule on the base branch means the merge queue, so an
      approved pull request that is not queued yet passes kanban_request_review for a person to
      queue. The default names no repository.
