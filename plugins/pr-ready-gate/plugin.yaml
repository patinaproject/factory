manifest_version: 2
name: pr-ready-gate
version: "0.1.0"
description: "Blocks kanban_complete and kanban_request_review in gated worker profiles until the task's pull request is open, not a draft, mergeable (mergeStateStatus CLEAN), and at the worktree's HEAD, or already merged at the worktree's HEAD. A merged pull request blocks kanban_request_review and points the worker to kanban_complete. kanban_request_review also accepts a pull request that GitHub holds at BLOCKED only for a missing or changes-requested review, once no check is pending and the gate has confirmed from the base branch rules that the newest run of every required check passed, commits are signed, review threads are resolved, no changes-requested review is on the current head, and no rule it cannot verify applies. Once a card lands in review, it asks each reviewer whose changes-requested review is on an older head to review again, and names them in the tool result, along with each failed check that no branch rule requires. It also asks the owner of the card's Linear issue to review on GitHub, through the GitHub account the owner connected in Linear. kanban_complete still needs every check to pass."
provides_hooks:
  - pre_tool_call
  - transform_tool_result
config_schema:
  gated_profiles:
    type: list
    default: [claude-worker]
    description: "Profiles whose Kanban workers must have a merge-ready or merged pull request before kanban_complete or kanban_request_review succeeds."
