manifest_version: 2
name: factory-secret-names
label: Factory secret names
kind: platform
version: "0.1.0"
description: >-
  Declares no platform and runs no code. Install it in both homes. Hermes strips
  every variable a home's platform plugins declare as a secret from each
  process that home starts, such as a terminal command, a background process,
  or a cron script. These are the factory's secrets that Hermes does not
  already strip, so no command a worker or the gateway runs can read them from
  another process's environment.
optional_env:
  - name: LINEAR_CLIENT_SECRET
    description: The Linear agent app's client secret. Only the gateway holds it.
  - name: LINEAR_WEBHOOK_SECRET
    description: The Linear webhook signing secret. Only the gateway holds it.
  - name: GITHUB_WEBHOOK_SECRET
    description: The GitHub webhook signing secret. Only the gateway holds it.
  - name: GITHUB_UPLOAD_TOKEN
    description: The operator's upload-only token for evidence images. Only the gateway holds it.
  - name: FACTORY_INFISICAL_CLIENT_SECRET
    description: The client secret of the machine identity that the gateway signs in to Infisical as.
  - name: CLAUDE_PROXY_TOKEN
    description: >-
      The model proxy's token, the variable that claude_session.auth_token_env
      names. The gateway and the worker's own agent loop send it; Claude Code
      gets it through apiKeyHelper.
  - name: SENTRY_ACCESS_TOKEN
    description: >-
      The read-only Sentry token, the variable that
      claude_session.mcp_servers.sentry.token_env names. Only the gateway
      holds it; the run's sentry server gets it through mcp-headers.
  - name: POSTHOG_PERSONAL_API_KEY
    description: >-
      The factory's PostHog personal API key, the variable that
      claude_session.mcp_servers.posthog.token_env names. Only the gateway
      holds it; the run's posthog server gets it through mcp-headers.
  - name: REVENUECAT_API_KEY
    description: >-
      The factory's RevenueCat API v2 secret key, the variable that
      claude_session.mcp_servers.revenuecat.token_env names. Only the gateway
      holds it; the run's revenuecat server gets it through mcp-headers.
  - name: DATAFORSEO_BASIC_TOKEN
    description: >-
      The base64 of the factory's DataForSEO API login and password, the variable that
      claude_session.mcp_servers.dataforseo.token_env names. Only the gateway
      holds it; the run's dataforseo server gets it through mcp-headers.
  - name: CLOUDFLARE_API_TOKEN
    description: >-
      The factory's Cloudflare account API token, the variable that
      claude_session.mcp_servers.cloudflare-bindings.token_env names. Only the gateway
      holds it; the run's cloudflare-bindings server gets it through mcp-headers.
  - name: FEATUREBASE_API_KEY
    description: >-
      The factory's Featurebase API key, the variable that
      claude_session.mcp_servers.featurebase.token_env names. Only the gateway
      holds it; the run's featurebase server gets it through mcp-headers.
  - name: CMS_MCP_API_KEY
    description: >-
      The factory's development key for a repository's own content-management
      MCP server, the variable that claude_session.mcp_servers.<server>.token_env
      names for that server. Only the gateway holds it; the run's server gets
      it through mcp-headers.
