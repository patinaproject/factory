manifest_version: 2
name: work
version: "0.1.0"
description: "Registers the skills in a directory on the machine as work:<name> skills for Hermes agents. The directory is read in place, so no skill content lives in this repository."
config_schema:
  skills_dir:
    type: string
    default: ""
    description: "Directory whose subdirectories each hold a SKILL.md. Unset registers nothing."
  allow:
    type: list
    default: []
    description: "Skill names to register. Empty registers every skill in skills_dir; a name the directory lacks refuses the load."
