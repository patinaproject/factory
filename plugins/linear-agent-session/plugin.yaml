manifest_version: 2
name: linear-agent-session
version: "0.1.0"
description: >-
  Drops a webhook delivery on any route whose secret is still an unresolved
  ${NAME} reference, requeues a Kanban worker whose provider key was empty
  at start instead of parking it as a rejected credential, acknowledges
  Linear agent session webhooks within Linear's 10-second deadline, archives
  the triage card of an issue that only left Triage without a triage turn,
  tells the card's agent session when a card blocks or is
  parked in triage, and gives agents the linear_agent_activity,
  linear_agent_activity_read, linear_issue, linear_agent_session_create, linear_delegated_issues,
  linear_issue_undelegate, linear_issue_to_todo, and linear_issue_edit tools, acting as the
  Linear agent app.
provides_hooks: [pre_gateway_dispatch, kanban_task_blocked, transform_api_error_classification]
provides_tools:
  - linear_agent_activity
  - linear_agent_activity_read
  - linear_issue
  - linear_agent_session_create
  - linear_delegated_issues
  - linear_issue_undelegate
  - linear_issue_to_todo
  - linear_issue_edit
config_schema:
  app_user_id:
    type: str
    default: ""
    description: Linear user ID of the agent app in this workspace.
  webhook_route:
    type: str
    default: linear
    description: Hermes webhook route whose AgentSessionEvent deliveries get the instant acknowledgement.
  repositories:
    type: list
    default: []
    description: Repositories the factory works, each with full_name, path, routing, and an optional worker_entry, such as /patina-mode, that claude-session puts before its built-in task prompt.
  kanban_url:
    type: str
    default: ""
    description: Optional Kanban dashboard URL that triage links from the Queued activity in Linear.
  github:
    type: dict
    default: {}
    description: >-
      The factory's GitHub App. login is the App's <app-slug>[bot] login, whose own events the github
      route ignores. app_id, installation_id, and private_key_path (absolute, mode 0600) let
      the gateway's broker mint installation tokens for the worker's gh login. With the broker
      user, its broker.json names the key instead, and these settings name none.
  triage:
    type: dict
    default: {}
    description: >-
      The Triage board. max_running caps how many triage cards run at once; dispatch-triage assigns
      triage cards only while fewer run.
  claude_session:
    type: dict
    default: {}
    description: Claude Code transport and run limits for claude-session.
