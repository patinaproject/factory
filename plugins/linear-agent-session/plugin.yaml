name: linear-agent-session
version: "0.1.0"
description: >-
  Acknowledges Linear agent session webhooks within Linear's 10-second deadline
  and gives agents the linear_agent_activity and linear_issue tools, acting as
  the Linear agent app.
provides_hooks: [pre_gateway_dispatch]
provides_tools: [linear_agent_activity, linear_issue]
requires_env:
  - LINEAR_CLIENT_ID
  - LINEAR_CLIENT_SECRET
config_schema:
  app_user_id:
    type: str
    default: ""
    description: Linear user ID of the agent app in this workspace.
  webhook_route:
    type: str
    default: linear
    description: Hermes webhook route whose AgentSessionEvent deliveries get the instant acknowledgement.
  repositories:
    type: list
    default: []
    description: Repositories the factory works, each with full_name, path, routing, and worker_entry.
  github_app:
    type: dict
    default: {}
    description: GitHub App identifiers (app_id, installation_id) used for pushes and pull requests.
  claude_session:
    type: dict
    default: {}
    description: Claude Code transport and run limits for claude-session.
