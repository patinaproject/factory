manifest_version: 2
name: linear-agent-session
version: "0.1.0"
description: >-
  Acknowledges Linear agent session webhooks within Linear's 10-second deadline
  and gives agents the linear_agent_activity, linear_issue, and
  linear_agent_session_create tools, acting as the Linear agent app.
provides_hooks: [pre_gateway_dispatch]
provides_tools: [linear_agent_activity, linear_issue, linear_agent_session_create]
config_schema:
  app_user_id:
    type: str
    default: ""
    description: Linear user ID of the agent app in this workspace.
  webhook_route:
    type: str
    default: linear
    description: Hermes webhook route whose AgentSessionEvent deliveries get the instant acknowledgement.
  repositories:
    type: list
    default: []
    description: Repositories the factory works, each with full_name, path, routing, and worker_entry.
  kanban_url:
    type: str
    default: ""
    description: Optional Kanban dashboard URL that triage links from the Queued activity in Linear.
  github:
    type: dict
    default: {}
    description: >-
      The factory's GitHub App. login is the App's <app-slug>[bot] login, whose own events the github
      route ignores. app_id, installation_id, and private_key_path (absolute, mode 0600) let
      refresh-gh-app-login mint installation tokens for the worker's gh login.
  claude_session:
    type: dict
    default: {}
    description: Claude Code transport and run limits for claude-session.
