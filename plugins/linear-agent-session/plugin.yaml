manifest_version: 2
name: linear-agent-session
version: "0.1.0"
description: >-
  Drops a webhook delivery on any route whose secret is still an unresolved
  ${NAME} reference, requeues a Kanban worker whose provider key was empty
  at start instead of parking it as a rejected credential, acknowledges
  Linear agent session webhooks within Linear's 10-second deadline, archives
  the triage card of an issue that only left Triage without a triage turn,
  refuses a card comment that names a pull request URL and a kanban_create call in a triage turn,
  tells the card's agent session when a card blocks or is
  parked in triage, posts a triage card's round of questions for the
  blocker-order hook through linear_triage_round, a tool no model sees, and gives agents the linear_agent_activity,
  linear_agent_activity_read, linear_issue, linear_agent_session_create, linear_delegated_issues,
  linear_issue_undelegate, linear_issue_to_todo, linear_issue_edit, linear_issue_relate, linear_issue_create, linear_issue_comment, linear_issue_search, github_issue_edit, and github_issue_create tools, acting as the
  Linear agent app.
provides_hooks: [pre_gateway_dispatch, pre_tool_call, kanban_task_blocked, transform_api_error_classification]
provides_tools:
  - linear_agent_activity
  - linear_agent_activity_read
  - linear_issue
  - linear_agent_session_create
  - linear_delegated_issues
  - linear_issue_undelegate
  - linear_issue_to_todo
  - linear_issue_edit
  - linear_issue_relate
  - linear_issue_create
  - linear_issue_comment
  - linear_issue_search
  - github_issue_edit
  - github_issue_create
  - linear_triage_round
config_schema:
  app_user_id:
    type: str
    default: ""
    description: Linear user ID of the agent app in this workspace.
  operator_user_ids:
    type: list
    default: []
    description: >-
      Linear user IDs of operators who, like an issue's assignee and the person who delegated it, can start card
      work with a reply or a pull request review or comment. Empty means no operator.
  default_team:
    type: str
    default: ""
    description: Linear team key, such as ABC, that linear_issue_create files in when the call names no team.
  webhook_route:
    type: str
    default: linear
    description: Hermes webhook route whose AgentSessionEvent deliveries get the instant acknowledgement.
  repositories:
    type: list
    default: []
    description: >-
      Repositories the factory works, each with full_name, path, routing, and an optional worker_entry, such as
      /patina-mode, that claude-session puts before its built-in task prompt. routing is default for exactly one
      repository, synced_github for a public repository whose GitHub issues sync to Linear, or linked for another
      private repository. A person names a linked repository on a Linear issue by attaching a link to it on GitHub,
      and linear_issue returns it as repository.
  factory_repository:
    type: dict
    default: {}
    description: >-
      The factory's own repository, as full_name and default_branch. The github route keeps a push to
      that branch from any sender, and factory-deploy starts auto-deploy for it.
  kanban_url:
    type: str
    default: ""
    description: Optional Kanban dashboard URL that triage links from the Queued activity in Linear.
  github:
    type: dict
    default: {}
    description: >-
      The factory's GitHub App. login is the App's <app-slug>[bot] login, whose own events the github
      route ignores. app_id, installation_id, and private_key_path (absolute, mode 0600) let
      the gateway's broker mint installation tokens for the worker's gh login. With the broker
      user, its broker.json names the key instead, and these settings name none.
  triage:
    type: dict
    default: {}
    description: >-
      The Triage board. max_running caps how many triage cards run at once; dispatch-triage assigns
      triage cards only while fewer run.
  dependency_updates:
    type: dict
    default: {}
    description: >-
      The weekly dependency-update issue. repository is the <owner>/<name> to update, team_key the Linear
      team that gets the issue, theme_label its one label, and type_label the type its description names.
      file-dependency-update refuses to run without all four.
  recurring_issues:
    type: list
    default: []
    description: >-
      The issues file-recurring-issues files on a cadence. Each entry is an object with repository
      (<owner>/<name>), team_key, title_prefix (the job appends the slot's start date), cadence (daily,
      weekly, or monthly), labels (a list of label names), and description. The job skips a malformed entry.
  sentry_sync:
    type: dict
    default: {}
    description: >-
      The Sentry-to-Linear sync. organization is the Sentry organization, team_key the Linear team, repository the
      <owner>/<name> whose checkout_path checkout holds the rules file at rules_path, sentry_label and theme_label
      the labels each issue gets, and mcp_server the claude_session.mcp_servers entry whose token reads Sentry.
      Empty means no sync: check-install then expects no sentry-linear-sync cron job.
  dependabot_sweep:
    type: dict
    default: {}
    description: >-
      The daily Dependabot sweep. team_key is the Linear team of a private default repository's issues, and label
      the theme label every issue gets, in Linear and in each synced_github repository. Empty means no sweep:
      check-install then expects no dependabot-sweep cron job, and check-github-access does not ask for Dependabot alerts.
  scheduled_commands:
    type: list
    default: []
    description: >-
      Repository commands that run on a Hermes cron schedule. Each entry has name (lowercase words joined by
      hyphens, unique), repository (<owner>/<name>), schedule (a five-field cron expression in the root profile's timezone), commands
      (a list of argv lists, run in order in a clean clone), and timeout_minutes (the budget for all of the commands together).
      The scheduled-command script reads it. Leave it empty to schedule nothing.
  claude_session:
    type: dict
    default: {}
    description: Claude Code transport and run limits for claude-session.
