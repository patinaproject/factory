name: Skills Sync

on:
  schedule:
    - cron: '17 6 * * *'
  repository_dispatch:
    types: [skills_stable_release]
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable skills release tag, such as v4.4.0. Empty means the greatest.
        required: false
        type: string

concurrency:
  group: skills-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    name: Sync released skills
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - name: Mint repository installation token
        id: app-token
        # actions/create-github-app-token@v2.1.4
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ secrets.SKILLS_SYNC_APP_ID }}
          private-key: ${{ secrets.SKILLS_SYNC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Check out the default branch
        # actions/checkout@v4.3.1
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Setup pnpm
        # pnpm/action-setup@v4.4.0
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320

      - name: Setup Node.js
        # actions/setup-node@v4.4.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync released skills
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ inputs.tag }}
        run: python3 scripts/skills-sync ${TAG:+--tag "$TAG"}
