platform_toolsets:
  cli: [terminal, kanban, linear_agent_session, claude_session]

# The worker has few tools, and it needs process_manage and the Linear tools
# on every turn; Tool Search would defer them behind tool_search.
tools:
  tool_search:
    enabled: "off"

# Hermes ends a tool call at timeouts.tools.sequential_call. The claude_session_run
# tool runs claude-session to its end in one call, with its own 28800 second
# limit and 30 second stop grace, so this stays above both. Every worker tool now
# shares that deadline, an accepted risk.
timeouts:
  tools:
    sequential_call: 28900

# terminal.timeout still caps a foreground terminal command that passes no
# timeout, and one process_manage wait. It is not the deadline for claude-session.
terminal:
  timeout: 400

skills:
  auto_load: [claude-code]

plugins:
  enabled: [linear-agent-session, pr-ready-gate, blocker-order]
  entries:
    linear-agent-session:
      settings:
        app_user_id: "<linear agent app user id>"
        operator_user_ids: []
        webhook_route: linear
        repositories:
          - full_name: example-org/example-repo
            path: /abs/path/to/example-repo
            routing: default
            worker_entry: ""
        triage:
          max_running: 2
        github:
          login: ""
          app_id: ""
          installation_id: ""
          private_key_path: ""
        claude_session:
          base_url: ""
          model: ""
          tier_models: {}
          auth_token_env: ""
          mcp_servers: {}
          disabled_mcp_servers: []
          max_turns: 0
    pr-ready-gate:
      settings:
        gated_profiles: [claude-worker]
