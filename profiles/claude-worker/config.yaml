platform_toolsets:
  cli: [terminal, kanban, linear_agent_session]

# The worker has few tools, and it needs process_manage and the Linear tools
# on every turn; Tool Search would defer them behind tool_search.
tools:
  tool_search:
    enabled: "off"

# One process_manage wait is capped by this many seconds, and so is every
# foreground terminal command that passes no timeout. Hermes ends any tool call
# at 420 seconds, so keep this below that. The worker waits on claude-session
# with it, so a long run costs a few model turns, not dozens.
terminal:
  timeout: 400

skills:
  auto_load: [claude-code]

plugins:
  enabled: [linear-agent-session, pr-ready-gate]
  entries:
    linear-agent-session:
      settings:
        app_user_id: "<linear agent app user id>"
        webhook_route: linear
        repositories:
          - full_name: example-org/example-repo
            path: /abs/path/to/example-repo
            routing: default
            worker_entry: ""
        triage:
          max_running: 2
        github:
          login: ""
          app_id: ""
          installation_id: ""
          private_key_path: ""
        claude_session:
          base_url: ""
          model: ""
          tier_models: {}
          auth_token_env: ""
          mcp_servers: {}
          disabled_mcp_servers: []
          max_turns: 0
    pr-ready-gate:
      settings:
        gated_profiles: [claude-worker]
